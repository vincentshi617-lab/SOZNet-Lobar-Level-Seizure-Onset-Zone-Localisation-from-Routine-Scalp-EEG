seed: 42
data:
  data_root: data/processed
  annotation_csv: data/labels.csv
  chunk_size: 2048
  num_electrodes: 18
training:
  batch_size: 32
  samples_per_session: 500
  epochs: 30
  patience: 20
  learning_rate: 0.0001
  weight_decay: 0.0001
  test_ratio: 0.1
  val_ratio: 0.1
loss:
  focal_gamma: 2.0
  pos_weight_factor: 3.0
  hemi_penalty_lambda: 0.1
inference:
  window_prob_threshold: 0.3
  session_prob_threshold: 0.5
